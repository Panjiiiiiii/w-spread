    target_contract: "Auth service returns authenticated user/session or a typed error; App shell receives user identity without trusting client-supplied entitlement."
    semantic_divergence: "Current implementation always succeeds after a timeout; real auth must expose invalid credentials, duplicate account, provider cancellation, and network failure."
